<svg viewBox="0 0 1060 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs>
<marker id="ar" markerWidth="13" markerHeight="13" refX="8.5" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 L3.2,5 Z" fill="#2F3772"/></marker>
<marker id="arR" markerWidth="13" markerHeight="13" refX="8.5" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 L3.2,5 Z" fill="#BE2E32"/></marker>
<marker id="arG" markerWidth="13" markerHeight="13" refX="8.5" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 L3.2,5 Z" fill="#2C7A4B"/></marker>
</defs><rect x="0" y="0" width="1060" height="660" fill="#fff"/><text x="40" y="38" font-size="22" font-weight="800"><tspan fill="#BE2E32">Red de Primera Respuesta en Salud</tspan><tspan fill="#1C232B" font-weight="600"> — SISOL · Municipalidad de Lima</tspan></text><text x="40" y="60" font-size="13" fill="#5E6A78">Llegamos primero · Estabilizamos · Salvamos vidas. Integra GRAVE (motos) + 43 Puestos de Atención Rápida (serenazgo + central) + SAMU/Bomberos + traslado al EE.SS. más cercano.</text><line x1="40" y1="74" x2="1020" y2="74" stroke="#C9A961" stroke-width="2"/><rect x="40" y="110" width="212" height="72" rx="12" fill="#FAF7F0" stroke="#C9A961" stroke-width="2"/><text x="146" y="142" text-anchor="middle" font-size="13" font-weight="800" fill="#1C232B">1 · ALERTA</text><text x="146" y="161" text-anchor="middle" font-size="11" fill="#1C232B">Ciudadano / Sereno</text><text x="146" y="175" text-anchor="middle" font-size="11" fill="#1C232B">llama a la central</text><rect x="270" y="110" width="212" height="72" rx="12" fill="#2F3772" stroke="#2F3772" stroke-width="2"/><text x="376" y="142" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2 · CENTRAL DE COMUNIC.</text><text x="376" y="161" text-anchor="middle" font-size="11" fill="#EAF0EE">Serenazgo MML: recibe,</text><text x="376" y="175" text-anchor="middle" font-size="11" fill="#EAF0EE">geolocaliza y triajea</text><rect x="500" y="110" width="212" height="72" rx="12" fill="#1F2552" stroke="#1F2552" stroke-width="2"/><text x="606" y="142" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3 · PUESTO ATENCIÓN RÁPIDA</text><text x="606" y="161" text-anchor="middle" font-size="11" fill="#EAF0EE">Despacha la unidad más</text><text x="606" y="175" text-anchor="middle" font-size="11" fill="#EAF0EE">cercana (red de 43 puestos)</text><rect x="730" y="110" width="212" height="72" rx="12" fill="#BE2E32" stroke="#BE2E32" stroke-width="2"/><text x="836" y="142" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4 · MOTO PARAMÉDICA</text><text x="836" y="161" text-anchor="middle" font-size="11" fill="#EAF0EE">SISOL: llega primero y</text><text x="836" y="175" text-anchor="middle" font-size="11" fill="#EAF0EE">estabiliza (maletín urgencias)</text><line x1="255" y1="146" x2="267" y2="146" stroke="#2F3772" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar)"/><line x1="485" y1="146" x2="497" y2="146" stroke="#2F3772" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar)"/><line x1="715" y1="146" x2="727" y2="146" stroke="#2F3772" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar)"/><path d="M836,182 C836,197 570,197 570,212" fill="none" stroke="#2F3772" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar)"/><polygon points="570,212 695,235 570,258 445,235" fill="#fff" stroke="#C9A961" stroke-width="2.5"/><text x="570" y="240" text-anchor="middle" font-size="13" font-weight="800" fill="#1C232B">TRIAJE EN SITIO</text><rect x="120" y="302" width="420" height="70" rx="12" fill="#EAF5EE" stroke="#2C7A4B" stroke-width="2"/><text x="330" y="333" text-anchor="middle" font-size="13" font-weight="800" fill="#2C7A4B">URGENCIA (prioridad II–III)</text><text x="330" y="352" text-anchor="middle" font-size="11" fill="#2C7A4B">Resuelve y observa en el sitio · evita traslado innecesario</text><rect x="600" y="302" width="420" height="70" rx="12" fill="#FBEAEA" stroke="#BE2E32" stroke-width="2"/><text x="810" y="333" text-anchor="middle" font-size="13" font-weight="800" fill="#BE2E32">EMERGENCIA (prioridad I)</text><text x="810" y="352" text-anchor="middle" font-size="11" fill="#BE2E32">Coordina SAMU (ambulancia) + Bomberos (rescate) → traslado</text><path d="M570,258 C570,280 330,280 330,302" fill="none" stroke="#2C7A4B" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arG)"/><path d="M570,258 C570,280 810,280 810,302" fill="none" stroke="#BE2E32" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arR)"/><text x="450" y="282" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2C7A4B">no crítico</text><text x="690" y="282" text-anchor="middle" font-size="10.5" font-weight="700" fill="#BE2E32">riesgo vital</text><rect x="700" y="406" width="320" height="72" rx="12" fill="#2F3772" stroke="#2F3772" stroke-width="2"/><text x="860" y="438" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5 · EE.SS. MÁS CERCANO</text><text x="860" y="457" text-anchor="middle" font-size="11" fill="#EAF0EE">Traslado al establecimiento de salud más cercano</text><text x="860" y="471" text-anchor="middle" font-size="11" fill="#EAF0EE">y apropiado (SISOL, MINSA o EsSalud) según el caso</text><path d="M810,372 C810,389 860,389 860,406" fill="none" stroke="#BE2E32" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arR)"/><rect x="40" y="512" width="980" height="86" rx="12" fill="#FAF7F0" stroke="#C9A961" stroke-width="1.5"/><text x="60" y="536" font-size="13" font-weight="800" fill="#2F3772">ECOSISTEMA ARTICULADO (no se duplica: cada actor en su rol)</text><text x="60" y="562" font-size="12" font-weight="700" fill="#BE2E32">Serenazgo + Central MML</text><text x="60" y="580" font-size="10.5" fill="#5E6A78">alerta, despacho, geolocalización</text><text x="248" y="562" font-size="12" font-weight="700" fill="#BE2E32">SISOL</text><text x="248" y="580" font-size="10.5" fill="#5E6A78">tripulación, equipamiento médico e insumos</text><text x="436" y="562" font-size="12" font-weight="700" fill="#BE2E32">SAMU</text><text x="436" y="580" font-size="10.5" fill="#5E6A78">ambulancia / traslado emergencia I</text><text x="624" y="562" font-size="12" font-weight="700" fill="#BE2E32">Bomberos</text><text x="624" y="580" font-size="10.5" fill="#5E6A78">rescate</text><text x="812" y="562" font-size="12" font-weight="700" fill="#BE2E32">EE.SS. más cercano</text><text x="812" y="580" font-size="10.5" fill="#5E6A78">atención definitiva (cualquier red)</text><text x="40" y="646" font-size="11" fill="#5E6A78">Demanda (GRAVE / SAMU 2025): 110,000 llamadas/año al SAMU (583/día) y 12,000 emergencias/año de Bomberos. La ambulancia tarda 20–30 min en el tráfico; la moto llega primero.</text></svg>